<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Styles -->
     <link rel="stylesheet" href="/styles/styles.css">
    <title>Contact Form</title>
</head>
<body>
    <main id="main">
        <header id="header">
            <h1>Contact Form</h1>
        </header>
        <!-- Form -->
        <form action="#" method="get" id="contact-form">

            <!-- Contact Info Fieldset -->
            <fieldset id="contact-info">
                <!-- First Name field -->
                <div class="row">
                    <div class="row-box">
                        <label for="f-name">First Name</label>
                        <input type="text" name="f-name" id="f-name">
                        <span class="error-msg">Please enter your first name.</span>
                    </div>
                    
                    <!-- Last name field -->
                    <div class="row-box">
                        <label for="l-name">Last Name</label>
                        <input type="text" name="" id="l-name">
                        <span class="error-msg">Please enter your last name.</span>
                    </div>

                    <!-- Job Title field -->
                    <div class="row-box">
                        <label for="job-title">Job Title</label>
                        <input type="text" name="job-title" id="job-title">
                        <span class="error-msg">Please enter your job title.</span>
                    </div>
                </div>

                <div class="row">
                    <!-- Company field -->
                    <div class="row-box">
                        <label for="company">Company</label>
                        <input type="text" name="company" id="company">
                    </div>
                    
                    <!-- LinkedIn URL field -->
                    <div class="row-box">
                        <label for="li-url">LinkedIn URL</label>
                        <input type="text" name="li-url" id="li-url">
                    </div>
                    
                    <!-- Email field -->
                    <div class="row-box">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email">
                    </div>
                </div>
            </fieldset>

            <!-- Meeting Info Fieldset -->
            <fieldset id="meet-info">
                <!-- Select list for possible methods of meeting -->
                <div class="row">
                    <div class="row-box">
                        <label for="meet-list" id="meet-list-label">How did we meet?</label>
                        <select name="meet-list" id="meet-list">
                            <option value="none">Please select</option>
                            <option value="person">In person</option>
                            <option value="others">Through an associate</option>
                            <option value="social-media">Social media</option>
                        </select>
                    </div>
                    <!-- Text field of alternative method of meeting -->
                    <div class="row-box">
                        <label for="meet-other" id="meet-other-label">Other (please specify)</label>
                        <input type="text" name="meet-other" id="meet-other">
                        <span class="error-msg">Please fill in one of the above fields</span>
                    </div>
                </div>
            </fieldset>

            <fieldset id="other-field">
                <!-- Message field-->
                <label for="message">Message</label>
                <textarea name="message" rows="5" id="message"></textarea>

                <!-- Mailing list checkbox -->
                <label for="mail-list">
                    <input type="checkbox" name="mail-list" id="mail-list">Please add me to your mailing list
                </label>

                <!-- Format radio buttons -->
                <div id="format-options">
                    <label for="format-btn">Choose a format:</label>
                    <label for="format-btn">
                        <input type="radio" name="format" id="html-btn" value="format-html">
                        HTML
                    </label>
                    <label for="format-btn">
                        <input type="radio" name="format" id="text-btn" value="format-text">
                        Text
                    </label>
                </div>
            </fieldset>

            <!-- Submit button -->
            <div id="btn-containter">
                <button type="submit" id="submit-btn">Submit</button>
            </div>
        </form>
    </main>
    
</body>
</html>
